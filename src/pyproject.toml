[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pychronicle"
version = "1.0.0"
description = "PyChronicle - Python execution analysis and time-travel debugging tool"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "click>=8.1.0"
]

[project.scripts]
pychronicle = "src.cli:cli"

[tool.setuptools]
packages = ["src"]